name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  companion:
    name: Build companion
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: companion/go.sum

      - name: Build
        working-directory: companion
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          OUT: herdr-mobiled-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w" -o "$OUT" ./cmd/herdr-mobiled

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: herdr-mobiled-${{ matrix.goos }}-${{ matrix.goarch }}
          path: companion/herdr-mobiled-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [companion]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            printf "Release %s\n" "$TAG_NAME" > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: List artifacts
        run: ls -R dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/herdr-mobiled-linux-amd64
            dist/herdr-mobiled-linux-arm64
            dist/herdr-mobiled-darwin-amd64
            dist/herdr-mobiled-darwin-arm64
